services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: signature_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./docker/php.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      - APP_ENV=local
    networks:
      - signature

  nginx:
    image: nginx:1.25-alpine
    container_name: signature_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - signature

  db:
    image: mysql:8.0
    container_name: signature_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-signature_pos}
      MYSQL_USER: ${DB_USERNAME:-signature}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - signature

  queue:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: signature_queue
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    command: php artisan queue:work --sleep=3 --tries=3
    depends_on:
      - db
    networks:
      - signature

volumes:
  db_data:

networks:
  signature:
    driver: bridge
